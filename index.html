<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f7fb" />
  <meta name="description" content="An interactive Java algorithms interview trainer. Learn the brute-force and optimal approaches to classic coding interview problems." />
  <title>AlgoRoom — Java Interview Practice</title>
  <style>
    :root {
      --ink: #17243a;
      --muted: #718096;
      --subtle: #a0aabc;
      --paper: #f6f7fb;
      --white: #ffffff;
      --line: #e8ebf2;
      --navy: #17243a;
      --navy-2: #21324e;
      --purple: #7357e8;
      --purple-soft: #f0edff;
      --mint: #1fb58a;
      --mint-soft: #e8faf4;
      --orange: #ef9755;
      --orange-soft: #fff2e8;
      --blue: #4b8fe8;
      --blue-soft: #edf5ff;
      --red: #e46f77;
      --red-soft: #fff0f1;
      --shadow: 0 16px 40px rgba(28, 43, 71, .07);
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
    .sidebar {
      background: #fff; border-right: 1px solid var(--line); padding: 28px 18px 22px;
      display: flex; flex-direction: column; min-height: 100vh; position: sticky; top: 0; height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px; margin-bottom: 38px; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; background: var(--navy); color: white; box-shadow: 0 5px 12px rgba(23,36,58,.18); }
    .brand-name { font-weight: 800; font-size: 18px; letter-spacing: -.7px; }
    .brand-name span { color: var(--purple); }
    .nav-label { padding: 0 12px; margin: 0 0 11px; color: #a2abba; font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; font-weight: 800; }
    .nav-list { display: grid; gap: 5px; }
    .nav-btn { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-radius: 12px; background: transparent; color: #728097; font-size: 13px; font-weight: 650; text-align: left; transition: .18s ease; }
    .nav-btn:hover { background: #f7f7fb; color: var(--ink); }
    .nav-btn.active { background: var(--purple-soft); color: var(--purple); }
    .nav-icon { width: 18px; height: 18px; display: inline-grid; place-items: center; flex: 0 0 18px; }
    .sidebar-spacer { flex: 1; }
    .goal-card { padding: 16px; margin: 18px 3px 16px; background: #f7f5ff; border: 1px solid #eeebff; border-radius: 16px; }
    .goal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
    .goal-title { font-weight: 750; font-size: 12px; }
    .goal-days { color: var(--purple); font-size: 10px; font-weight: 800; }
    .goal-copy { color: #7d819c; font-size: 11px; line-height: 1.5; margin-bottom: 12px; }
    .goal-track { height: 6px; background: #e6e0ff; border-radius: 99px; overflow: hidden; }
    .goal-fill { height: 100%; background: var(--purple); width: 0%; border-radius: 99px; transition: width .3s; }
    .profile { display: flex; gap: 10px; align-items: center; padding: 13px 8px 3px; border-top: 1px solid var(--line); }
    .avatar { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: #e9f2ff; color: #3c78c9; font-weight: 800; font-size: 12px; }
    .profile-name { font-size: 12px; font-weight: 750; }
    .profile-role { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .main-area { min-width: 0; padding: 25px clamp(20px, 4vw, 56px) 56px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; max-width: 1320px; margin: 0 auto 28px; }
    .crumb { color: #98a1b1; font-size: 12px; font-weight: 650; }
    .crumb strong { color: #4b5870; font-weight: 750; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .top-chip { display: flex; gap: 7px; align-items: center; border: 1px solid var(--line); background: white; border-radius: 999px; padding: 8px 12px; font-size: 11px; font-weight: 750; color: #607088; }
    .kbd { border: 1px solid #e8eaf0; background: #f8f9fb; padding: 2px 5px; border-radius: 5px; font-size: 9px; color: #9ba4b3; }
    .content { max-width: 1320px; margin: 0 auto; }
    .eyebrow { color: var(--purple); font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 850; display: flex; gap: 8px; align-items: center; }
    .eyebrow:before { content: ''; width: 19px; height: 2px; background: var(--purple); display: inline-block; border-radius: 4px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(28px, 3.3vw, 42px); letter-spacing: -1.7px; line-height: 1.12; margin: 12px 0 10px; }
    h2 { font-size: 22px; letter-spacing: -.75px; }
    h3 { font-size: 15px; letter-spacing: -.25px; }
    .muted { color: var(--muted); }
    .hero { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(260px,.8fr); gap: 20px; margin-bottom: 27px; }
    .hero-card { background: var(--navy); color: white; border-radius: 23px; padding: clamp(24px,3vw,38px); min-height: 245px; position: relative; overflow: hidden; box-shadow: 0 18px 36px rgba(23,36,58,.14); }
    .hero-card:after { content: ''; position: absolute; width: 320px; height: 320px; border: 1px solid rgba(255,255,255,.09); border-radius: 50%; right: -106px; top: -139px; box-shadow: 0 0 0 27px rgba(255,255,255,.025), 0 0 0 58px rgba(255,255,255,.02); }
    .hero-card .eyebrow { color: #b9aaff; position: relative; z-index: 1; }
    .hero-card .eyebrow:before { background: #aa94ff; }
    .hero-card h1 { max-width: 530px; position: relative; z-index: 1; }
    .hero-card h1 span { color: #b9aaff; }
    .hero-copy { color: #aebbd0; font-size: 13px; line-height: 1.65; max-width: 480px; margin: 0 0 24px; position: relative; z-index: 1; }
    .hero-buttons { display: flex; gap: 10px; position: relative; z-index: 2; flex-wrap: wrap; }
    .btn { border: 0; border-radius: 11px; padding: 11px 16px; font-size: 12px; font-weight: 800; transition: transform .16s, box-shadow .16s, background .16s; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--purple); color: white; box-shadow: 0 6px 15px rgba(115,87,232,.2); }
    .btn-primary:hover { background: #6448d7; }
    .btn-light { color: var(--ink); background: white; }
    .btn-outline { background: white; color: #66758c; border: 1px solid var(--line); }
    .btn-soft { background: var(--purple-soft); color: var(--purple); }
    .btn-ghost { background: transparent; color: #6e7b90; padding: 9px 10px; }
    .btn-dark { color: white; background: var(--navy); }
    .daily-card { background: white; border: 1px solid var(--line); border-radius: 23px; padding: 23px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow); }
    .daily-top { display: flex; justify-content: space-between; align-items: center; }
    .daily-label { font-size: 11px; color: #9aa4b4; font-weight: 800; text-transform: uppercase; letter-spacing: .9px; }
    .daily-icon { width: 35px; height: 35px; border-radius: 12px; background: var(--orange-soft); color: #e18a48; display: grid; place-items: center; }
    .daily-card h2 { font-size: 26px; margin: 15px 0 3px; }
    .daily-card p { color: var(--muted); font-size: 11px; line-height: 1.5; margin-bottom: 18px; }
    .daily-progress { display: flex; justify-content: space-between; color: #8e99aa; font-size: 10px; font-weight: 750; margin-bottom: 7px; }
    .track { height: 7px; background: #edf0f5; border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; width: 0%; background: var(--mint); border-radius: 99px; transition: width .35s; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 13px; margin-bottom: 32px; }
    .stat-card { background: white; border: 1px solid var(--line); border-radius: 16px; padding: 17px 18px; display: flex; align-items: center; gap: 12px; }
    .stat-icon { width: 37px; height: 37px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
    .stat-icon.purple { background: var(--purple-soft); color: var(--purple); }
    .stat-icon.mint { background: var(--mint-soft); color: var(--mint); }
    .stat-icon.orange { background: var(--orange-soft); color: var(--orange); }
    .stat-icon.blue { background: var(--blue-soft); color: var(--blue); }
    .stat-number { font-size: 20px; font-weight: 850; letter-spacing: -.6px; line-height: 1; }
    .stat-label { font-size: 10px; color: #8b97aa; font-weight: 650; margin-top: 5px; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin: 0 0 15px; }
    .section-head h2 { margin: 7px 0 0; font-size: 20px; }
    .section-head p { color: var(--muted); font-size: 11px; margin: 5px 0 0; }
    .problem-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 15px; margin-bottom: 31px; }
    .problem-card { background: white; border: 1px solid var(--line); border-radius: 18px; padding: 19px; transition: .18s ease; cursor: pointer; position: relative; min-width: 0; }
    .problem-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: #dcd6ff; }
    .problem-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 17px; }
    .problem-symbol { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 18px; font-weight: 850; }
    .problem-symbol.water { background: var(--blue-soft); color: var(--blue); }
    .problem-symbol.palindrome { background: var(--orange-soft); color: #dc8744; }
    .problem-symbol.zeros { background: var(--mint-soft); color: var(--mint); }
    .difficulty { color: #6ea98d; background: #ecf8f1; font-size: 9px; font-weight: 850; padding: 5px 8px; border-radius: 99px; }
    .problem-card h3 { font-size: 15px; margin: 0 0 7px; }
    .problem-card p { font-size: 11px; color: #8591a3; line-height: 1.55; min-height: 35px; margin-bottom: 16px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .tag { padding: 5px 7px; border-radius: 6px; background: #f5f6fa; color: #7e8a9f; font-size: 9px; font-weight: 750; }
    .card-bottom { border-top: 1px solid #f0f1f5; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; }
    .card-progress { color: #9aa5b5; font-size: 10px; font-weight: 700; }
    .card-arrow { display: grid; place-items: center; width: 25px; height: 25px; background: #f7f7fb; border-radius: 8px; color: #8490a4; }
    .bottom-grid { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(270px,.75fr); gap: 16px; }
    .panel { background: white; border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
    .panel h3 { margin-bottom: 14px; }
    .path-steps { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
    .path-step { display: flex; gap: 9px; align-items: flex-start; }
    .step-num { flex: 0 0 24px; height: 24px; display: grid; place-items: center; background: #f1efff; color: var(--purple); border-radius: 8px; font-size: 10px; font-weight: 850; }
    .path-step strong { display: block; font-size: 10px; margin: 2px 0 4px; }
    .path-step small { display: block; font-size: 9px; line-height: 1.4; color: #9aa4b3; }
    .tip-panel { background: #fffaf5; border-color: #f5eadf; }
    .tip-title { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; font-weight: 800; color: #9e673c; }
    .tip-panel p { color: #9b8876; font-size: 11px; line-height: 1.6; margin: 0; }
    .page-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 23px; }
    .page-heading h1 { font-size: 32px; }
    .page-heading p { color: var(--muted); font-size: 12px; line-height: 1.6; max-width: 620px; margin-bottom: 0; }
    .problem-hero { background: white; border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 17px; margin-bottom: 20px; }
    .problem-hero .problem-symbol { width: 52px; height: 52px; font-size: 21px; }
    .problem-hero h2 { font-size: 19px; margin: 0 0 4px; }
    .problem-hero p { color: var(--muted); font-size: 11px; margin: 0; line-height: 1.5; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .pill { background: #f5f6fa; border: 1px solid #eef0f5; color: #7a879b; border-radius: 99px; padding: 4px 8px; font-size: 9px; font-weight: 750; }
    .mode-grid { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 11px; margin-bottom: 24px; }
    .mode-card { background: white; border: 1px solid var(--line); border-radius: 16px; padding: 15px; cursor: pointer; transition: .18s; min-height: 138px; text-align: left; color: var(--ink); }
    .mode-card:hover { border-color: #cfc5ff; transform: translateY(-2px); box-shadow: var(--shadow); }
    .mode-card.selected { border-color: var(--purple); box-shadow: 0 0 0 2px rgba(115,87,232,.09); }
    .mode-emoji { width: 31px; height: 31px; border-radius: 10px; display: grid; place-items: center; background: #f1efff; color: var(--purple); margin-bottom: 12px; }
    .mode-card strong { display: block; font-size: 11px; margin-bottom: 5px; }
    .mode-card small { color: #929daf; font-size: 9px; line-height: 1.45; display: block; }
    .study-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 15px; margin-bottom: 22px; }
    .solution-card { background: white; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
    .solution-head { padding: 17px 19px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .solution-head h3 { margin: 0; }
    .solution-type { font-size: 9px; font-weight: 850; padding: 5px 8px; border-radius: 99px; }
    .solution-type.brute { background: var(--orange-soft); color: #d88446; }
    .solution-type.optimal { background: var(--mint-soft); color: #169a75; }
    .solution-body { padding: 18px 19px; }
    .solution-body p { color: #78869b; font-size: 11px; line-height: 1.6; margin: 0 0 13px; }
    .complexity-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 14px; }
    .complexity { background: #f7f8fb; border: 1px solid #eff1f5; border-radius: 8px; padding: 7px 9px; }
    .complexity small { display: block; font-size: 8px; color: #9ca7b6; font-weight: 750; margin-bottom: 3px; }
    .complexity strong { font-size: 11px; }
    .code-wrap { background: #17243a; border-radius: 11px; overflow: hidden; }
    .code-top { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .code-top span { color: #a5b4cb; font-size: 9px; font-weight: 750; }
    .copy-btn { border: 0; background: rgba(255,255,255,.09); color: #c8d2e2; font-size: 9px; font-weight: 750; border-radius: 6px; padding: 5px 8px; }
    pre { margin: 0; padding: 13px; overflow-x: auto; color: #dce6f3; font-size: 10px; line-height: 1.65; tab-size: 4; }
    code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .playbook { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; margin: 0 0 21px; }
    .play-card { border: 1px solid var(--line); background: white; border-radius: 14px; padding: 14px; }
    .play-card .step-num { margin-bottom: 9px; }
    .play-card strong { display: block; font-size: 10px; margin-bottom: 4px; }
    .play-card p { margin: 0; color: #8c98a9; font-size: 9px; line-height: 1.55; }
    .prompt-box { border: 1px solid #ebe8ff; background: #faf9ff; border-radius: 14px; padding: 16px; margin-bottom: 18px; }
    .prompt-box strong { display: block; font-size: 11px; margin-bottom: 6px; }
    .prompt-box p { color: #8582a0; font-size: 10px; line-height: 1.5; margin: 0; }
    .quiz-shell { max-width: 900px; margin: 0 auto; }
    .quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 17px; }
    .quiz-tag { font-size: 10px; font-weight: 850; color: var(--purple); background: var(--purple-soft); padding: 7px 10px; border-radius: 8px; text-transform: uppercase; letter-spacing: .5px; }
    .quiz-stats { display: flex; gap: 9px; align-items: center; }
    .quiz-stat { background: white; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; color: #6e7d93; font-size: 10px; font-weight: 800; display: flex; align-items: center; gap: 5px; }
    .quiz-progress { height: 6px; background: #e9ebf2; border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
    .quiz-progress-fill { height: 100%; background: var(--purple); border-radius: 99px; transition: width .25s; }
    .question-card { background: white; border: 1px solid var(--line); border-radius: 22px; padding: clamp(21px,3vw,34px); box-shadow: var(--shadow); }
    .question-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .question-category { color: #9aa4b3; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 850; }
    .question-number { color: #a0aabc; font-size: 10px; font-weight: 800; }
    .question-card h2 { font-size: clamp(20px,2.5vw,27px); line-height: 1.35; letter-spacing: -.8px; max-width: 760px; margin: 0 0 13px; }
    .question-detail { color: #7f8ba0; font-size: 12px; line-height: 1.65; margin-bottom: 17px; }
    .question-code { margin: 0 0 18px; }
    .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .option { display: flex; align-items: flex-start; gap: 11px; padding: 13px 14px; border: 1px solid #e9ecf3; background: white; border-radius: 12px; text-align: left; color: #45546b; min-height: 60px; transition: .16s; }
    .option:hover:not(:disabled) { border-color: #c8bfff; background: #fbfaff; }
    .option:disabled { cursor: default; }
    .option-letter { flex: 0 0 24px; height: 24px; display: grid; place-items: center; border: 1px solid #e7eaf1; background: #f7f8fb; border-radius: 7px; color: #8290a6; font-size: 10px; font-weight: 850; }
    .option-text { padding-top: 3px; font-size: 11px; line-height: 1.45; font-weight: 650; }
    .option.correct { border-color: #9adcc7; background: #f0fbf6; }
    .option.correct .option-letter { background: var(--mint); color: white; border-color: var(--mint); }
    .option.wrong { border-color: #efb7bb; background: #fff6f6; }
    .option.wrong .option-letter { background: var(--red); color: white; border-color: var(--red); }
    .feedback { display: none; padding: 14px 15px; margin-top: 15px; border-radius: 12px; font-size: 11px; line-height: 1.6; }
    .feedback.show { display: block; }
    .feedback.good { background: var(--mint-soft); color: #287b65; border: 1px solid #caeee1; }
    .feedback.bad { background: var(--red-soft); color: #a65e65; border: 1px solid #f5d7d9; }
    .feedback strong { display: block; margin-bottom: 3px; color: inherit; }
    .quiz-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; }
    .hint-toggle { background: transparent; border: 0; padding: 8px 4px; color: #8290a5; font-size: 10px; font-weight: 750; }
    .hint-content { display: none; background: #fffaf2; border: 1px solid #f5e7d4; padding: 11px 13px; border-radius: 10px; color: #997c5c; font-size: 10px; line-height: 1.5; margin-top: 10px; }
    .hint-content.show { display: block; }
    .quiz-side-note { color: #9aa5b5; font-size: 10px; }
    .results-card { background: white; border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: clamp(25px,4vw,42px); text-align: center; }
    .result-medal { width: 68px; height: 68px; display: grid; place-items: center; border-radius: 22px; margin: 0 auto 17px; background: var(--purple-soft); color: var(--purple); }
    .results-card h1 { font-size: 34px; margin-bottom: 8px; }
    .results-card > p { color: var(--muted); font-size: 12px; margin-bottom: 24px; }
    .result-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; max-width: 540px; margin: 0 auto 23px; }
    .result-stat { background: #f8f9fc; border: 1px solid #eef0f4; border-radius: 13px; padding: 14px; }
    .result-stat strong { display: block; font-size: 22px; letter-spacing: -.5px; }
    .result-stat small { color: #99a3b1; font-size: 9px; font-weight: 750; }
    .result-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; }
    .review-list { text-align: left; margin: 27px auto 0; max-width: 650px; border-top: 1px solid var(--line); padding-top: 18px; }
    .review-list h3 { margin-bottom: 12px; }
    .review-item { border: 1px solid #edf0f5; border-radius: 11px; padding: 11px 12px; margin-bottom: 8px; }
    .review-item strong { display: block; font-size: 10px; margin-bottom: 5px; }
    .review-item small { font-size: 9px; line-height: 1.5; color: #8995a7; }
    .review-mark { float: right; font-size: 10px; font-weight: 850; }
    .review-mark.ok { color: var(--mint); }
    .review-mark.no { color: var(--red); }
    .empty-state { background: white; border: 1px solid var(--line); border-radius: 18px; padding: 32px; text-align: center; }
    .empty-state h2 { font-size: 19px; }

  <script>
    // The quiz interface is JavaScript; every interview solution shown to the learner is Java.
    const problems = {
      water: {
        id: 'water', title: 'Container With Most Water', short: 'Most water', number: '11', difficulty: 'Medium', symbol: '↗',
        description: 'Choose two vertical lines that, together with the x-axis, hold the maximum amount of water.',
        tags: ['Array', 'Two Pointers', 'Greedy'],
        input: 'An integer array height where height[i] is the height of a vertical line at index i.',
        output: 'Return the maximum water area formed by two different lines.',
        constraints: 'Assume at least two lines and non-negative heights. The width is the distance between the two indices.',
        firstQuestions: ['Can the height values be zero?', 'Must I return the area or the pair of indices?', 'Can I use the same line twice?'],
        brute: {
          idea: 'Try every pair (left, right). For each pair, calculate the width and the shorter wall, then keep the largest area. This directly checks every possible container.',
          time: 'O(n²)', space: 'O(1)',
          code: `class Solution {\n    public int maxArea(int[] height) {\n        int best = 0;\n\n        for (int left = 0; left < height.length; left++) {\n            for (int right = left + 1;\n                 right < height.length; right++) {\n\n                int width = right - left;\n                int wall = Math.min(\n                    height[left], height[right]\n                );\n                int area = width * wall;\n                best = Math.max(best, area);\n            }\n        }\n        return best;\n    }\n}`
        },
        optimal: {
          idea: 'Start with the widest pair: the first and last lines. The shorter wall limits the water level. Moving the taller wall inward cannot improve the area because the width shrinks while the limiting height cannot increase. Move the shorter wall and update the best area.',
          time: 'O(n)', space: 'O(1)',
          code: `class Solution {\n    public int maxArea(int[] height) {\n        int left = 0;\n        int right = height.length - 1;\n        int best = 0;\n\n        while (left < right) {\n            int width = right - left;\n            int wall = Math.min(\n                height[left], height[right]\n            );\n            best = Math.max(best, width * wall);\n\n            if (height[left] < height[right]) {\n                left++;\n            } else {\n                right--;\n            }\n        }\n        return best;\n    }\n}`
        },
        approach: 'The key observation is that the water level is limited by the shorter wall. Begin with the widest possible pair, then discard the shorter side because keeping it while shrinking the width cannot create a better area.'
      },
      palindrome: {
        id: 'palindrome', title: 'Valid Palindrome', short: 'Valid palindrome', number: '125', difficulty: 'Easy', symbol: 'Aa',
        description: 'Determine whether a string reads the same forward and backward after ignoring punctuation, spaces, and letter casing.',
        tags: ['String', 'Two Pointers'],
        input: 'A string s containing letters, digits, spaces, and punctuation.',
        output: 'Return true if the filtered string is a palindrome; otherwise return false.',
        constraints: 'Compare letters without case sensitivity. Ignore every character that is not a letter or digit. An empty filtered string is a palindrome.',
        firstQuestions: ['Should uppercase and lowercase letters match?', 'Should spaces and punctuation be compared?', 'What should happen if no letters or digits remain?'],
        brute: {
          idea: 'Build a second string containing only letters and digits, converting each character to lowercase. Reverse that normalized string and compare the two strings.',
          time: 'O(n)', space: 'O(n)',
          code: `class Solution {\n    public boolean isPalindrome(String s) {\n        StringBuilder clean = new StringBuilder();\n\n        for (int i = 0; i < s.length(); i++) {\n            char c = s.charAt(i);\n            if (Character.isLetterOrDigit(c)) {\n                clean.append(Character.toLowerCase(c));\n            }\n        }\n\n        String forward = clean.toString();\n        String backward = clean.reverse().toString();\n        return forward.equals(backward);\n    }\n}`
        },
        optimal: {
          idea: 'Use one pointer at each end. Skip non-alphanumeric characters, compare the next valid pair without case sensitivity, and move inward. You never need to create a cleaned or reversed string.',
          time: 'O(n)', space: 'O(1)',
          code: `class Solution {\n    public boolean isPalindrome(String s) {\n        int left = 0;\n        int right = s.length() - 1;\n\n        while (left < right) {\n            while (left < right &&\n                   !Character.isLetterOrDigit(s.charAt(left))) {\n                left++;\n            }\n            while (left < right &&\n                   !Character.isLetterOrDigit(s.charAt(right))) {\n                right--;\n            }\n\n            char a = Character.toLowerCase(s.charAt(left));\n            char b = Character.toLowerCase(s.charAt(right));\n            if (a != b) return false;\n\n            left++;\n            right--;\n        }\n        return true;\n    }\n}`
        },
        approach: 'First define what counts as a character: letters and digits only, with case ignored. A simple baseline is normalize-then-compare. To reduce extra memory, compare from both ends while skipping characters that do not belong to the comparison.'
      },
      zeros: {
        id: 'zeros', title: 'Move Zeroes', short: 'Move zeroes', number: '283', difficulty: 'Easy', symbol: '0→',
        description: 'Move every zero to the end of an integer array while keeping the non-zero elements in their original order.',
        tags: ['Array', 'Two Pointers', 'In-place'],
        input: 'An integer array nums. The array may contain zeroes and positive or negative non-zero values.',
        output: 'Modify nums in place so all zeroes are at the end.',
        constraints: 'Preserve the relative order of all non-zero values. Do not return a new array as the final result.',
        firstQuestions: ['Does the original order of non-zero values matter?', 'Must the same array be modified?', 'Can negative values appear?'],
        brute: {
          idea: 'Create a temporary array filled with zeroes. Copy each non-zero value into it from left to right, then copy the temporary array back into nums. The extra array makes the stable ordering straightforward.',
          time: 'O(n)', space: 'O(n)',
          code: `class Solution {\n    public void moveZeroes(int[] nums) {\n        int[] temp = new int[nums.length];\n        int write = 0;\n\n        for (int value : nums) {\n            if (value != 0) {\n                temp[write] = value;\n                write++;\n            }\n        }\n\n        System.arraycopy(temp, 0, nums, 0, nums.length);\n    }\n}`
        },
        optimal: {
          idea: 'Keep a write pointer for the next position that should receive a non-zero value. Scan the array once, writing each non-zero value forward. Then fill the remaining positions with zero. This preserves order and uses constant extra space.',
          time: 'O(n)', space: 'O(1)',
          code: `class Solution {\n    public void moveZeroes(int[] nums) {\n        int write = 0;\n\n        for (int read = 0; read < nums.length; read++) {\n            if (nums[read] != 0) {\n                nums[write] = nums[read];\n                write++;\n            }\n        }\n\n        while (write < nums.length) {\n            nums[write] = 0;\n            write++;\n        }\n    }\n}`
        },
        approach: 'Protect the order of non-zero values. Imagine a separate output area: the first non-zero goes in slot 0, the next in slot 1, and so on. Then ask whether that output area can be represented by a write pointer inside the original array.'
      }
    };

    // Questions are intentionally about interview reasoning as well as code mechanics.
    const questions = [
      // CONTAINER WITH MOST WATER
      {id:'w1',problem:'water',mode:'understand',category:'Understand the prompt',prompt:'For Container With Most Water, what does one candidate solution consist of?',detail:'Focus on what the two chosen indices represent.',options:['Two different indices that select two vertical lines','One index and the height of that line','Two adjacent heights only','A contiguous subarray of positive values'],correct:0,explanation:'A container is formed by choosing two different lines at indices left and right. Their horizontal distance is the width.',hint:'The walls of the container are selected from the input array.'},
      {id:'w2',problem:'water',mode:'understand',category:'Understand the prompt',prompt:'Which expression gives the area formed by lines at indices left and right?',detail:'The water cannot rise above the shorter of the two walls.',options:['(right - left) × max(height[left], height[right])','(right - left) × min(height[left], height[right])','(right + left) × min(height[left], height[right])','height[left] + height[right]'],correct:1,explanation:'Width is right - left. The shorter wall limits the water height, so multiply by the minimum of the two heights.',hint:'Think about what would happen if the taller wall were much taller but the other wall stayed short.'},
      {id:'w3',problem:'water',mode:'understand',category:'Understand the prompt',prompt:'Which clarification is most important before coding this problem?',detail:'You are confirming the contract, not trying to optimize yet.',options:['Whether the returned value is the maximum area or the indices','Whether the array must be sorted first','Whether every height must be unique','Whether the answer should be a floating-point value'],correct:0,explanation:'Confirming the required output prevents implementing the wrong contract. The standard problem asks for the maximum area.',hint:'Restate exactly what the caller expects your method to return.'},
      {id:'w4',problem:'water',mode:'approach',category:'How to begin',prompt:'You are in an interview and have just read the prompt. What is the strongest first move?',detail:'Pick the action that makes the problem precise before choosing an optimization.',options:['Immediately write a two-pointer loop','Restate the input, output, and how a pair produces area','Sort the heights to find the largest values','Start with a binary search'],correct:1,explanation:'Restate the contract and define area first. Then work through a small example and identify a correct baseline.',hint:'Interviewers want to see that you understand the task before coding.'},
      {id:'w5',problem:'water',mode:'approach',category:'How to begin',prompt:'What is the natural brute-force plan for this problem?',detail:'A baseline should be obviously correct even if it is not fast.',options:['Check every pair of indices and calculate its area','Sort the array and multiply the first and last values','Check only pairs with adjacent indices','Use a stack to store increasing heights'],correct:0,explanation:'Every valid container is defined by a pair. Enumerating all pairs guarantees that the maximum candidate is considered.',hint:'How many independent choices define a container?'},
      {id:'w6',problem:'water',mode:'approach',category:'How to begin',prompt:'After establishing the O(n²) baseline, what question leads toward the optimal solution?',detail:'Look for a reason that some candidate pairs can be discarded safely.',options:['Can I skip checking pairs that cannot beat the current best?','Can I sort the array without changing the answer?','Can I store every pair in a hash map?','Can I replace the area calculation with a sum?'],correct:0,explanation:'Optimization comes from proving that certain pairs are dominated. The shorter boundary tells us which side can be discarded.',hint:'Focus on the limiting wall and what happens when width shrinks.'},
      {id:'w7',problem:'water',mode:'brute',category:'Brute-force reasoning',prompt:'What are the time and extra-space complexities of checking every pair with two nested loops?',detail:'There are roughly n × (n - 1) / 2 pairs, and only a few variables are stored.',options:['O(n) time and O(1) space','O(n²) time and O(1) space','O(n²) time and O(n) space','O(log n) time and O(1) space'],correct:1,explanation:'The number of pairs grows quadratically. The method stores only indices, area, and the current maximum, so extra space is constant.',hint:'Count the pairs, not just the loop variables.'},
      {id:'w8',problem:'water',mode:'brute',category:'Brute-force reasoning',prompt:'Why does enumerating every pair guarantee a correct maximum?',detail:'Consider whether the algorithm can miss a valid pair.',options:['It visits every possible pair of different indices','It always visits the tallest line first','It makes every candidate width equal','It sorts the heights implicitly'],correct:0,explanation:'Any legal container corresponds to one pair of indices. Since every pair is evaluated, the algorithm cannot miss the maximum.',hint:'Correctness follows from exhaustive coverage of the candidate set.'},
      {id:'w9',problem:'water',mode:'optimal',category:'Optimal solution',prompt:'In the two-pointer approach, which pointer should move after evaluating the current area?',detail:'Assume the left wall is shorter than the right wall.',options:['Move the right pointer inward','Move both pointers inward','Move the left pointer inward','Keep both pointers fixed'],correct:2,explanation:'The shorter wall is the limiting height. Keeping it while reducing width cannot improve area, so move the shorter side to search for a taller limiting wall.',hint:'Ask which side currently caps the water level.'},
      {id:'w10',problem:'water',mode:'optimal',category:'Optimal solution',prompt:'Why is moving the taller wall inward not useful as the greedy step?',detail:'The width always decreases when either pointer moves inward.',options:['The new width becomes larger','The shorter wall still limits the height while width decreases','The taller wall becomes zero','The array becomes unsorted'],correct:1,explanation:'If the shorter wall stays fixed, the maximum possible height is still limited by it, while the width gets smaller. That move cannot improve the current area.',hint:'Keep one boundary fixed and reason about the best possible height.'},
      {id:'w11',problem:'water',mode:'optimal',category:'Optimal solution',prompt:'What is the time complexity of the two-pointer solution?',detail:'Each pointer moves inward and never moves backward.',options:['O(n²)','O(n log n)','O(n)','O(1)'],correct:2,explanation:'Across the whole run, the pointers make at most n - 1 inward moves. Every move takes constant work, so time is O(n).',hint:'Count total pointer movements over the entire run.'},
      {id:'w12',problem:'water',mode:'optimal',category:'Optimal solution',prompt:'Which invariant best describes the two-pointer scan?',detail:'Think about what the algorithm has already ruled out as the pointers move.',options:['Every pair inside the current window is guaranteed to be optimal','At each step, a limiting shorter boundary is discarded because its remaining partners cannot improve on the current width','The pointers always point to equal heights','The current area is always increasing'],correct:1,explanation:'The greedy proof discards the shorter boundary: any pair using it with a closer partner has no greater limiting height and less width.',hint:'A useful invariant explains why discarded candidates no longer need to be checked.'},
      {id:'w13',problem:'water',mode:'complexity',category:'Complexity check',prompt:'Compare the two valid approaches. Which statement is accurate?',detail:'Consider both runtime and auxiliary memory.',options:['Brute force O(n²)/O(1); optimal O(n)/O(1)','Brute force O(n)/O(n); optimal O(n²)/O(1)','Both are O(n²) time','Optimal uses O(n) extra memory to store all pairs'],correct:0,explanation:'The nested loops examine all pairs in quadratic time. Two pointers reduce the scan to linear time; both use constant auxiliary space.',hint:'The two-pointer method does not allocate another array.'},
      {id:'w14',problem:'water',mode:'complexity',category:'Complexity check',prompt:'If n doubles, which growth pattern best describes the brute-force pair count?',detail:'Compare the approximate number of pairs before and after doubling n.',options:['It stays about the same','It roughly doubles','It roughly quadruples','It increases by one'],correct:2,explanation:'Quadratic growth scales by 2² when the input size doubles, so the pair count grows by roughly four times.',hint:'Think about n multiplied by n.'},

      // VALID PALINDROME
      {id:'p1',problem:'palindrome',mode:'understand',category:'Understand the prompt',prompt:'For Valid Palindrome, which characters participate in the comparison?',detail:'The prompt defines a normalized view of the string.',options:['Every character, including spaces and punctuation','Letters and digits only','Letters only; digits are ignored','Only lowercase letters'],correct:1,explanation:'The comparison ignores non-alphanumeric characters and treats uppercase and lowercase versions of a letter as equal.',hint:'The phrase “alphanumeric” includes two character families.'},
      {id:'p2',problem:'palindrome',mode:'understand',category:'Understand the prompt',prompt:'What should the algorithm return for a string that becomes empty after filtering?',detail:'No character pair can contradict the palindrome condition.',options:['false','Throw an exception','true','Return the original string'],correct:2,explanation:'An empty filtered string is a palindrome under this problem’s definition: there is no mismatching pair.',hint:'A palindrome check fails only when a compared pair differs.'},
      {id:'p3',problem:'palindrome',mode:'understand',category:'Understand the prompt',prompt:'Which pair of characters should compare as equal under the problem rules?',detail:'Assume both characters are letters.',options:['A and a','A and 1','! and ?','b and c'],correct:0,explanation:'Case is ignored, so uppercase A and lowercase a represent the same letter for the comparison.',hint:'Normalize letter casing before comparing.'},
      {id:'p4',problem:'palindrome',mode:'approach',category:'How to begin',prompt:'What should you clarify before implementing Valid Palindrome?',detail:'The exact comparison rules affect every later step.',options:['Whether punctuation and spaces are ignored and whether case matters','Whether the string is already sorted','Whether the input is always numeric','Whether the answer should contain the reversed string'],correct:0,explanation:'Confirm the definition of a valid character and the casing rule. Then test a short mixed-case example with punctuation.',hint:'Turn the natural-language rules into a precise character filter.'},
      {id:'p5',problem:'palindrome',mode:'approach',category:'How to begin',prompt:'What is a simple correct baseline solution?',detail:'Prefer a straightforward method you can prove before optimizing space.',options:['Normalize the string, reverse it, and compare','Sort the characters and compare','Count only vowels','Use binary search on the string'],correct:0,explanation:'Filtering to lowercase letters and digits, reversing, and comparing directly matches the palindrome definition.',hint:'A palindrome is unchanged by reversing its normalized form.'},
      {id:'p6',problem:'palindrome',mode:'approach',category:'How to begin',prompt:'What is the main optimization opportunity in the normalized-string solution?',detail:'The baseline stores a cleaned copy and a reversed representation.',options:['Avoid comparing characters','Compare from both ends without building another string','Sort the input in place','Use recursion to create more strings'],correct:1,explanation:'Two pointers can compare matching positions from the outside inward while skipping invalid characters, avoiding an O(n) cleaned copy.',hint:'Can you compare the outermost valid characters directly in the original string?'},
      {id:'p7',problem:'palindrome',mode:'brute',category:'Brute-force reasoning',prompt:'What extra space does the normalize-and-reverse approach use?',detail:'The cleaned string can contain up to n characters.',options:['O(1)','O(log n)','O(n)','O(n²)'],correct:2,explanation:'The cleaned representation may hold a linear number of characters, so its auxiliary space is O(n).',hint:'Consider the worst case where every input character is kept.'},
      {id:'p8',problem:'palindrome',mode:'brute',category:'Brute-force reasoning',prompt:'Why is comparing the cleaned string with its reverse a valid baseline?',detail:'The cleaned string already reflects the problem’s character and case rules.',options:['It checks whether the normalized sequence reads identically in both directions','It guarantees the string contains unique characters','It checks whether the original string is sorted','It removes every repeated character'],correct:0,explanation:'After filtering and normalizing, a palindrome is exactly a sequence equal to its reversal.',hint:'Apply the palindrome definition after the required normalization.'},
      {id:'p9',problem:'palindrome',mode:'optimal',category:'Optimal solution',prompt:'What do the two pointers do when the left character is punctuation?',detail:'Only alphanumeric characters should be compared.',options:['Compare it with the right character','Move the left pointer forward until it reaches a letter or digit','Return false immediately','Swap it with the right character'],correct:1,explanation:'Non-alphanumeric characters are ignored, so advance the left pointer until it reaches a character that participates in the comparison.',hint:'Ignored characters should not consume a comparison.'},
      {id:'p10',problem:'palindrome',mode:'optimal',category:'Optimal solution',prompt:'When should the two-pointer palindrome algorithm return false?',detail:'The current pair contains two valid alphanumeric characters.',options:['Whenever the pointers move','When the normalized lowercase characters differ','When the characters have different original casing','When punctuation exists between the pointers'],correct:1,explanation:'A mismatch between the two valid characters proves that the normalized string is not a palindrome.',hint:'Case and punctuation have already been handled before this comparison.'},
      {id:'p11',problem:'palindrome',mode:'optimal',category:'Optimal solution',prompt:'What makes the two-pointer version O(1) auxiliary space?',detail:'The string is read in place; no filtered copy or reverse is created.',options:['It stores only two indices and a few character variables','It uses a second array of length n','It creates a reversed StringBuilder','It stores all valid characters in a set'],correct:0,explanation:'Only a constant number of variables are added, regardless of input length. The runtime is still O(n).',hint:'Separate the input storage from memory allocated by the algorithm.'},
      {id:'p12',problem:'palindrome',mode:'optimal',category:'Optimal solution',prompt:'What is the worst-case time complexity of the optimized scan?',detail:'Each pointer only advances through the string.',options:['O(1)','O(log n)','O(n)','O(n²)'],correct:2,explanation:'Each character is skipped or compared a constant number of times. The total work is linear.',hint:'Neither pointer ever moves backward.'},
      {id:'p13',problem:'palindrome',mode:'complexity',category:'Complexity check',prompt:'Which comparison of the two approaches is correct?',detail:'Both methods must inspect the input characters.',options:['Both O(n) time; baseline O(n) extra space, two pointers O(1)','Baseline O(n²), two pointers O(log n)','Baseline O(1) space, two pointers O(n) space','Both O(n²) time and O(n²) space'],correct:0,explanation:'Both approaches take linear time. The two-pointer approach avoids materializing a normalized string, reducing auxiliary space to O(1).',hint:'The optimization changes memory use, not the asymptotic time.'},
      {id:'p14',problem:'palindrome',mode:'complexity',category:'Complexity check',prompt:'If the input contains only punctuation and spaces, how much work is needed?',detail:'The algorithm still has to inspect the input to know every character is ignored.',options:['O(1) time because there are no letters','O(n) time to scan the characters','O(n²) time to compare every pair','O(log n) time using binary search'],correct:1,explanation:'Even if no character participates in the final comparison, the algorithm must scan the n input characters to establish that fact.',hint:'Ignoring a character still requires reading it.'},

      // MOVE ZEROES
      {id:'z1',problem:'zeros',mode:'understand',category:'Understand the prompt',prompt:'Which requirement is easy to overlook in Move Zeroes?',detail:'There are two correctness requirements, not just one.',options:['Non-zero values must keep their original relative order','The array must be sorted numerically','All negative values must be removed','The method must return a new array'],correct:0,explanation:'The operation must move zeroes to the end while preserving the order of all non-zero values.',hint:'Compare the order of the non-zero values before and after.'},
      {id:'z2',problem:'zeros',mode:'understand',category:'Understand the prompt',prompt:'What does “in place” mean for this problem?',detail:'Think about where the final arrangement must appear.',options:['Return an immutable copy','Modify the given array rather than using a new result as the final output','Sort a separate array and leave nums unchanged','Print the array to the console'],correct:1,explanation:'The required final arrangement must be written into the original input array.',hint:'The method signature returns void in the standard version.'},
      {id:'z3',problem:'zeros',mode:'understand',category:'Understand the prompt',prompt:'Which output satisfies the rules for input [0, 1, 0, 3, 12]?',detail:'Non-zero order must stay stable.',options:['[12, 3, 1, 0, 0]','[1, 3, 12, 0, 0]','[1, 0, 3, 12, 0]','[0, 0, 1, 3, 12]'],correct:1,explanation:'The non-zero values remain in their original order: 1, then 3, then 12. Both zeroes are placed at the end.',hint:'Do not sort the non-zero values.'},
      {id:'z4',problem:'zeros',mode:'approach',category:'How to begin',prompt:'What is the first key clarification for Move Zeroes?',detail:'There is a constraint beyond simply grouping the zeroes.',options:['Whether non-zero relative order must be preserved and the array modified in place','Whether the input is already sorted','Whether the array contains only positive integers','Whether zero is larger than every element'],correct:0,explanation:'Stability and in-place mutation define the challenge. They guide the choice of algorithm and memory target.',hint:'Ask what must remain unchanged while zeroes move.'},
      {id:'z5',problem:'zeros',mode:'approach',category:'How to begin',prompt:'What is a clear baseline algorithm?',detail:'Make stability obvious before removing the extra memory.',options:['Copy non-zero values into a temporary array, then copy it back','Sort the input array','Swap every zero with the first element','Remove zeroes and shorten the array'],correct:0,explanation:'A temporary array receives non-zero values from left to right. Its unused slots remain zero, and copying it back satisfies the output requirements.',hint:'A new array begins with every slot initialized to zero in Java.'},
      {id:'z6',problem:'zeros',mode:'approach',category:'How to begin',prompt:'How can the temporary-array idea be adapted to O(1) extra space?',detail:'You still need somewhere to remember the next destination for a non-zero value.',options:['Use a write pointer inside nums','Sort nums after copying','Use a recursive call for every zero','Keep a hash map of all indices'],correct:0,explanation:'A write pointer identifies the next open position. Non-zero values can be compacted toward the front of the original array.',hint:'Only the next destination index needs to be remembered.'},
      {id:'z7',problem:'zeros',mode:'brute',category:'Brute-force reasoning',prompt:'What are the complexities of copying through a temporary array and then copying back?',detail:'One pass reads the input, another copy writes n positions.',options:['O(n) time and O(n) extra space','O(n²) time and O(1) extra space','O(log n) time and O(n) extra space','O(1) time and O(1) extra space'],correct:0,explanation:'The scan and array copy each take linear time. The temporary array has n elements, so auxiliary space is O(n).',hint:'The temporary array grows with the input.'},
      {id:'z8',problem:'zeros',mode:'brute',category:'Brute-force reasoning',prompt:'Why does the temporary array preserve non-zero ordering?',detail:'Values are copied while traversing nums from the first index to the last.',options:['Values are sorted by size','Values are appended in the exact order encountered','A stack reverses them twice','The array is traversed from right to left'],correct:1,explanation:'The scan visits non-zero values from left to right and writes them sequentially, so their relative order is unchanged.',hint:'No sorting or reordering operation occurs during the copy.'},
      {id:'z9',problem:'zeros',mode:'optimal',category:'Optimal solution',prompt:'In the in-place solution, what does the write pointer represent?',detail:'It advances only when a non-zero value is placed.',options:['The index of the next zero to remove','The next position that should receive a non-zero value','The last non-zero value in sorted order','The number of zeroes remaining'],correct:1,explanation:'The write pointer tracks the boundary of the compacted non-zero prefix. Every accepted non-zero is written at that position.',hint:'Think of the prefix before write as the area already filled with non-zero values.'},
      {id:'z10',problem:'zeros',mode:'optimal',category:'Optimal solution',prompt:'After moving all non-zero values forward, what must happen to the remaining suffix?',detail:'The array must still have its original length.',options:['Fill every remaining position with zero','Leave the old values untouched','Sort the suffix','Delete the suffix from the array'],correct:0,explanation:'The remaining positions must be overwritten with zero so no stale values remain after the compacted prefix.',hint:'The array length does not change.'},

    function pickQuestions(mode, problemId, timed) {
      let pool = questions.filter(q => problemId === 'all' ? true : q.problem === problemId);
      if (mode !== 'mixed') pool = pool.filter(q => q.mode === mode);
      pool = pool.slice();
      for (let i=pool.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
      if (mode === 'mixed') return pool.slice(0,15);
      return pool.slice(0, Math.min(8,pool.length));
    }
    function startQuiz(mode, problemId='water', timed=false) {
      const resolvedProblem = mode === 'mixed' && problemId === 'water' && view === 'quick' ? 'all' : problemId;
      const qs = pickQuestions(mode, resolvedProblem, timed);
      if (!qs.length) { showToast('No questions in this round yet.'); return; }
      activeQuiz = {mode,problemId:resolvedProblem,questions:qs,index:0,score:0,streak:0,bestStreak:0,answered:false,selected:null,results:[],timed,started:Date.now(),secondsPerQuestion:15};
      remaining = 15; hintOpen = false; view='quiz'; render(); window.scrollTo({top:0,behavior:'smooth'});
    }
    function renderQuiz() {
      if (!activeQuiz) return renderQuick();
      if (activeQuiz.index >= activeQuiz.questions.length) return renderResults();
      const q = activeQuiz.questions[activeQuiz.index];
      const p = problems[q.problem];
      const modeLabel = activeQuiz.mode === 'mixed' ? 'Mixed interview sprint' : modeMeta[activeQuiz.mode].title;
      const pct = (activeQuiz.index / activeQuiz.questions.length) * 100;
      const chosen = activeQuiz.selected;
      const isCorrect = chosen === q.correct;
      const options = q.options.map((option,i)=>{
        let cls = '';
        if (activeQuiz.answered && i === q.correct) cls = 'correct';
        else if (activeQuiz.answered && i === chosen) cls = 'wrong';
        return `<button class="option ${cls}" data-answer="${i}" ${activeQuiz.answered?'disabled':''}><span class="option-letter">${String.fromCharCode(65+i)}</span><span class="option-text">${escapeHTML(option)}</span></button>`;
      }).join('');
      const answerLabel = chosen === null ? 'Time is up' : isCorrect ? 'That is right' : 'Not quite';
      const timeDisplay = activeQuiz.timed ? `${remaining}s` : 'Untimed';
      return `<div class="quiz-shell">
        <div class="quiz-top"><div><div class="quiz-tag">${escapeHTML(modeLabel)}</div><div style="font-size:10px;color:#9aa5b5;font-weight:700;margin-top:8px">${escapeHTML(p.title)} · ${escapeHTML(q.category)}</div></div><div class="quiz-stats"><div class="quiz-stat">${icon('trophy')} ${activeQuiz.score} pts</div><div class="quiz-stat">✦ ${activeQuiz.streak} streak</div><div class="quiz-stat">${icon('clock')} <span id="timer-text">${timeDisplay}</span></div></div></div>
        <div class="quiz-progress"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
        <article class="question-card">
          <div class="question-meta"><span class="question-category">${escapeHTML(q.category)}</span><span class="question-number">QUESTION ${activeQuiz.index+1} / ${activeQuiz.questions.length}</span></div>
          <h2>${escapeHTML(q.prompt)}</h2>
          ${q.detail ? `<p class="question-detail">${escapeHTML(q.detail)}</p>` : ''}
          <div class="option-grid">${options}</div>
          <div class="feedback ${activeQuiz.answered?'show '+(isCorrect?'good':'bad'):''}" id="answer-feedback">${activeQuiz.answered?`<strong>${answerLabel}</strong>${escapeHTML(q.explanation)}`:''}</div>
          <div class="hint-content ${hintOpen?'show':''}" id="hint-content">${escapeHTML(q.hint)}</div>
          <div class="quiz-footer"><div><button class="hint-toggle" onclick="toggleHint()">${hintOpen?'Hide hint':'Need a hint?'} · no points lost</button><div class="quiz-side-note">${activeQuiz.timed?'Answer before the timer reaches zero.':'Take your time and explain why.'}</div></div><button class="btn btn-primary" id="next-btn" ${activeQuiz.answered?'':'disabled style="opacity:.45;cursor:not-allowed"'} onclick="nextQuestion()">${activeQuiz.index === activeQuiz.questions.length-1?'See results':'Next question'} ${icon('arrow')}</button></div>
        </article>
        <div style="display:flex;justify-content:space-between;gap:15px;margin-top:13px;color:#a2abba;font-size:9px;font-weight:700"><span>JAVA INTERVIEW PREP</span><button class="btn btn-ghost" style="font-size:9px" onclick="exitQuiz()">Exit round</button></div>
      </div>`;
    }
    function answerQuestion(index) {
      if (!activeQuiz || activeQuiz.answered) return;
      activeQuiz.selected = index; activeQuiz.answered = true;
      stopTimer();
      const q = activeQuiz.questions[activeQuiz.index];
      const correct = index === q.correct;
      const points = correct ? (activeQuiz.timed ? 100 + Math.max(0,remaining)*10 : 100) : 0;
      if (correct) { activeQuiz.score += points; activeQuiz.streak++; activeQuiz.bestStreak=Math.max(activeQuiz.bestStreak,activeQuiz.streak); }
      else activeQuiz.streak=0;
      activeQuiz.results.push({question:q,selected:index,correct,points});
      render();
    }
    function timeOut() {
      if (!activeQuiz || activeQuiz.answered) return;
      activeQuiz.selected = null; activeQuiz.answered = true; activeQuiz.streak=0;
      const q = activeQuiz.questions[activeQuiz.index];
      activeQuiz.results.push({question:q,selected:null,correct:false,points:0});
      render();
    }
    function nextQuestion() {
      if (!activeQuiz || !activeQuiz.answered) return;
      activeQuiz.index++; activeQuiz.answered=false; activeQuiz.selected=null; remaining=15; hintOpen=false;
      render(); window.scrollTo({top:0,behavior:'smooth'});
    }
    function toggleHint() { hintOpen=!hintOpen; const el=document.getElementById('hint-content'); if(el) el.classList.toggle('show',hintOpen); const btn=document.querySelector('.hint-toggle'); if(btn) btn.textContent=(hintOpen?'Hide hint':'Need a hint?')+' · no points lost'; }
    function startTimer() {
      stopTimer(); remaining=15;
      quizTimer=setInterval(()=>{
        remaining--; const el=document.getElementById('timer-text'); if(el) el.textContent=remaining+'s';
        if (remaining<=0) { stopTimer(); timeOut(); }
      },1000);
    }
    function stopTimer() { if(quizTimer) clearInterval(quizTimer); quizTimer=null; }
    function exitQuiz() { stopTimer(); activeQuiz=null; view='quick'; render(); }
    function finishProgress() {
      const total=activeQuiz.results.length, correct=activeQuiz.results.filter(r=>r.correct).length;
      progress.answered += total; progress.correct += correct; progress.bestScore=Math.max(progress.bestScore,activeQuiz.score); progress.sessions++;
      const ids=[...new Set(activeQuiz.questions.map(q=>q.problem))];
      ids.forEach(id=>{
        const qs=activeQuiz.results.filter(r=>r.question.problem===id);
        if(!progress.byProblem[id]) progress.byProblem[id]={answered:0,correct:0};
        progress.byProblem[id].answered += qs.length; progress.byProblem[id].correct += qs.filter(r=>r.correct).length;
      });
      todayCount += total; localStorage.setItem('algoroom-today-count',String(todayCount)); localStorage.setItem('algoroom-today-stamp',todayKey); saveProgress();
    }
    function renderResults() {
      if (!activeQuiz.saved) { finishProgress(); activeQuiz.saved=true; }
      const total=activeQuiz.results.length, correct=activeQuiz.results.filter(r=>r.correct).length, accuracy=Math.round(correct/total*100);
      const seconds=Math.round((Date.now()-activeQuiz.started)/1000);
      const title=accuracy>=85?'Strong round.':accuracy>=60?'Good progress.':'Keep building the fundamentals.';
      return `<div class="quiz-shell"><div class="results-card"><div class="result-medal">${icon('trophy')}</div><div class="eyebrow" style="justify-content:center">Round complete</div><h1>${title}</h1><p>You answered ${correct} out of ${total} questions correctly. Review the explanations, then try again to improve your score.</p>
        <div class="result-stats"><div class="result-stat"><strong>${activeQuiz.score}</strong><small>POINTS</small></div><div class="result-stat"><strong>${accuracy}%</strong><small>ACCURACY</small></div><div class="result-stat"><strong>${activeQuiz.bestStreak}</strong><small>BEST STREAK</small></div></div>
        <div class="result-actions"><button class="btn btn-primary" onclick="startQuiz('${activeQuiz.mode}','${activeQuiz.problemId}',${activeQuiz.timed})">${icon('play')} Play again</button><button class="btn btn-outline" onclick="navigate('problems')">Choose another problem</button><button class="btn btn-ghost" onclick="navigate('home')">Dashboard</button></div>
        <div class="review-list"><h3>Answer review</h3>${activeQuiz.results.map((r,i)=>`<div class="review-item"><span class="review-mark ${r.correct?'ok':'no'}">${r.correct?'✓ Correct':'✕ Review'}</span><strong>${i+1}. ${escapeHTML(r.question.prompt)}</strong><small>${escapeHTML(r.question.explanation)}</small></div>`).join('')}</div>
      </div></div>`;
    }
    function navigate(next) { stopTimer(); activeQuiz=null; view=next; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    function bindDynamic() {
      document.querySelectorAll('[data-answer]').forEach(btn=>btn.addEventListener('click',()=>answerQuestion(Number(btn.dataset.answer))));
    }
    function copyCode(button) {
      const code=button.closest('.code-wrap').querySelector('code').textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(()=>{button.textContent='Copied';setTimeout(()=>button.textContent='Copy code',1300);}).catch(()=>fallbackCopy(code,button));
      else fallbackCopy(code,button);
    }
    function fallbackCopy(text,button) { const area=document.createElement('textarea'); area.value=text; document.body.appendChild(area); area.select(); try{document.execCommand('copy');button.textContent='Copied';}catch{button.textContent='Select to copy';} area.remove();setTimeout(()=>button.textContent='Copy code',1300); }
    let toastTimer;
    function showToast(message) { const el=document.getElementById('toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800); }

    document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.nav)));
    render();
  </script>
</body>
</html>
