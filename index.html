const SEED = {"problems":{"water":{"id":"water","title":"Container With Most Water","short":"Most water","number":"11","difficulty":"Medium","symbol":"↗","description":"Choose two vertical lines that, together with the x-axis, hold the maximum amount of water.","tags":["Array","Two Pointers","Greedy"],"input":"An integer array height where height[i] is the height of a vertical line at index i.","output":"Return the maximum water area formed by two different lines.","constraints":"Assume at least two lines and non-negative heights. The width is the distance between the two indices.","firstQuestions":["Can the height values be zero?","Must I return the area or the pair of indices?","Can I use the same line twice?"],"brute":{"idea":"Try every pair (left, right). For each pair, calculate the width and the shorter wall, then keep the largest area. This directly checks every possible container.","time":"O(n²)","space":"O(1)","code":"class Solution {\n    public int maxArea(int[] height) {\n        int best = 0;\n\n        for (int left = 0; left \u003c height.length; left++) {\n            for (int right = left + 1;\n                 right \u003c height.length; right++) {\n\n                int width = right - left;\n                int wall = Math.min(\n                    height[left], height[right]\n                );\n                int area = width * wall;\n                best = Math.max(best, area);\n            }\n        }\n        return best;\n    }\n}"},"optimal":{"idea":"Start with the widest pair: the first and last lines. The shorter wall limits the water level. Moving the taller wall inward cannot improve the area because the width shrinks while the limiting height cannot increase. Move the shorter wall and update the best area.","time":"O(n)","space":"O(1)","code":"class Solution {\n    public int maxArea(int[] height) {\n        int left = 0;\n        int right = height.length - 1;\n        int best = 0;\n\n        while (left \u003c right) {\n            int width = right - left;\n            int wall = Math.min(\n                height[left], height[right]\n            );\n            best = Math.max(best, width * wall);\n\n            if (height[left] \u003c height[right]) {\n                left++;\n            } else {\n                right--;\n            }\n        }\n        return best;\n    }\n}"},"approach":"The key observation is that the water level is limited by the shorter wall. Begin with the widest possible pair, then discard the shorter side because keeping it while shrinking the width cannot create a better area."},"palindrome":{"id":"palindrome","title":"Valid Palindrome","short":"Valid palindrome","number":"125","difficulty":"Easy","symbol":"Aa","description":"Determine whether a string reads the same forward and backward after ignoring punctuation, spaces, and letter casing.","tags":["String","Two Pointers"],"input":"A string s containing letters, digits, spaces, and punctuation.","output":"Return true if the filtered string is a palindrome; otherwise return false.","constraints":"Compare letters without case sensitivity. Ignore every character that is not a letter or digit. An empty filtered string is a palindrome.","firstQuestions":["Should uppercase and lowercase letters match?","Should spaces and punctuation be compared?","What should happen if no letters or digits remain?"],"brute":{"idea":"Build a second string containing only letters and digits, converting each character to lowercase. Reverse that normalized string and compare the two strings.","time":"O(n)","space":"O(n)","code":"class Solution {\n    public boolean isPalindrome(String s) {\n        StringBuilder clean = new StringBuilder();\n\n        for (int i = 0; i \u003c s.length(); i++) {\n            char c = s.charAt(i);\n            if (Character.isLetterOrDigit(c)) {\n                clean.append(Character.toLowerCase(c));\n            }\n        }\n\n        String forward = clean.toString();\n        String backward = clean.reverse().toString();\n        return forward.equals(backward);\n    }\n}"},"optimal":{"idea":"Use one pointer at each end. Skip non-alphanumeric characters, compare the next valid pair without case sensitivity, and move inward. You never need to create a cleaned or reversed string.","time":"O(n)","space":"O(1)","code":"class Solution {\n    public boolean isPalindrome(String s) {\n        int left = 0;\n        int right = s.length() - 1;\n\n        while (left \u003c right) {\n            while (left \u003c right \u0026\u0026\n                   !Character.isLetterOrDigit(s.charAt(left))) {\n                left++;\n            }\n            while (left \u003c right \u0026\u0026\n                   !Character.isLetterOrDigit(s.charAt(right))) {\n                right--;\n            }\n\n            char a = Character.toLowerCase(s.charAt(left));\n            char b = Character.toLowerCase(s.charAt(right));\n            if (a != b) return false;\n\n            left++;\n            right--;\n        }\n        return true;\n    }\n}"},"approach":"First define what counts as a character: letters and digits only, with case ignored. A simple baseline is normalize-then-compare. To reduce extra memory, compare from both ends while skipping characters that do not belong to the comparison."},"zeros":{"id":"zeros","title":"Move Zeroes","short":"Move zeroes","number":"283","difficulty":"Easy","symbol":"0→","description":"Move every zero to the end of an integer array while keeping the non-zero elements in their original order.","tags":["Array","Two Pointers","In-place"],"input":"An integer array nums. The array may contain zeroes and positive or negative non-zero values.","output":"Modify nums in place so all zeroes are at the end.","constraints":"Preserve the relative order of all non-zero values. Do not return a new array as the final result.","firstQuestions":["Does the original order of non-zero values matter?","Must the same array be modified?","Can negative values appear?"],"brute":{"idea":"Create a temporary array filled with zeroes. Copy each non-zero value into it from left to right, then copy the temporary array back into nums. The extra array makes the stable ordering straightforward.","time":"O(n)","space":"O(n)","code":"class Solution {\n    public void moveZeroes(int[] nums) {\n        int[] temp = new int[nums.length];\n        int write = 0;\n\n        for (int value : nums) {\n            if (value != 0) {\n                temp[write] = value;\n                write++;\n            }\n        }\n\n        System.arraycopy(temp, 0, nums, 0, nums.length);\n    }\n}"},"optimal":{"idea":"Keep a write pointer for the next position that should receive a non-zero value. Scan the array once, writing each non-zero value forward. Then fill the remaining positions with zero. This preserves order and uses constant extra space.","time":"O(n)","space":"O(1)","code":"class Solution {\n    public void moveZeroes(int[] nums) {\n        int write = 0;\n\n        for (int read = 0; read \u003c nums.length; read++) {\n            if (nums[read] != 0) {\n                nums[write] = nums[read];\n                write++;\n            }\n        }\n\n        while (write \u003c nums.length) {\n            nums[write] = 0;\n            write++;\n        }\n    }\n}"},"approach":"Protect the order of non-zero values. Imagine a separate output area: the first non-zero goes in slot 0, the next in slot 1, and so on. Then ask whether that output area can be represented by a write pointer inside the original array."}},"questions":[{"id":"w1","problem":"water","mode":"understand","category":"Understand the prompt","prompt":"For Container With Most Water, what does one candidate solution consist of?","detail":"Focus on what the two chosen indices represent.","options":["Two different indices that select two vertical lines","One index and the height of that line","Two adjacent heights only","A contiguous subarray of positive values"],"correct":0,"explanation":"A container is formed by choosing two different lines at indices left and right. Their horizontal distance is the width.","hint":"The walls of the container are selected from the input array."},{"id":"w2","problem":"water","mode":"understand","category":"Understand the prompt","prompt":"Which expression gives the area formed by lines at indices left and right?","detail":"The water cannot rise above the shorter of the two walls.","options":["(right - left) × max(height[left], height[right])","(right - left) × min(height[left], height[right])","(right + left) × min(height[left], height[right])","height[left] + height[right]"],"correct":1,"explanation":"Width is right - left. The shorter wall limits the water height, so multiply by the minimum of the two heights.","hint":"Think about what would happen if the taller wall were much taller but the other wall stayed short."},{"id":"w3","problem":"water","mode":"understand","category":"Understand the prompt","prompt":"Which clarification is most important before coding this problem?","detail":"You are confirming the contract, not trying to optimize yet.","options":["Whether the returned value is the maximum area or the indices","Whether the array must be sorted first","Whether every height must be unique","Whether the answer should be a floating-point value"],"correct":0,"explanation":"Confirming the required output prevents implementing the wrong contract. The standard problem asks for the maximum area.","hint":"Restate exactly what the caller expects your method to return."},{"id":"w4","problem":"water","mode":"approach","category":"How to begin","prompt":"You are in an interview and have just read the prompt. What is the strongest first move?","detail":"Pick the action that makes the problem precise before choosing an optimization.","options":["Immediately write a two-pointer loop","Restate the input, output, and how a pair produces area","Sort the heights to find the largest values","Start with a binary search"],"correct":1,"explanation":"Restate the contract and define area first. Then work through a small example and identify a correct baseline.","hint":"Interviewers want to see that you understand the task before coding."},{"id":"w5","problem":"water","mode":"approach","category":"How to begin","prompt":"What is the natural brute-force plan for this problem?","detail":"A baseline should be obviously correct even if it is not fast.","options":["Check every pair of indices and calculate its area","Sort the array and multiply the first and last values","Check only pairs with adjacent indices","Use a stack to store increasing heights"],"correct":0,"explanation":"Every valid container is defined by a pair. Enumerating all pairs guarantees that the maximum candidate is considered.","hint":"How many independent choices define a container?"},{"id":"w6","problem":"water","mode":"approach","category":"How to begin","prompt":"After establishing the O(n²) baseline, what question leads toward the optimal solution?","detail":"Look for a reason that some candidate pairs can be discarded safely.","options":["Can I skip checking pairs that cannot beat the current best?","Can I sort the array without changing the answer?","Can I store every pair in a hash map?","Can I replace the area calculation with a sum?"],"correct":0,"explanation":"Optimization comes from proving that certain pairs are dominated. The shorter boundary tells us which side can be discarded.","hint":"Focus on the limiting wall and what happens when width shrinks."},{"id":"w7","problem":"water","mode":"brute","category":"Brute-force reasoning","prompt":"What are the time and extra-space complexities of checking every pair with two nested loops?","detail":"There are roughly n × (n - 1) / 2 pairs, and only a few variables are stored.","options":["O(n) time and O(1) space","O(n²) time and O(1) space","O(n²) time and O(n) space","O(log n) time and O(1) space"],"correct":1,"explanation":"The number of pairs grows quadratically. The method stores only indices, area, and the current maximum, so extra space is constant.","hint":"Count the pairs, not just the loop variables."},{"id":"w8","problem":"water","mode":"brute","category":"Brute-force reasoning","prompt":"Why does enumerating every pair guarantee a correct maximum?","detail":"Consider whether the algorithm can miss a valid pair.","options":["It visits every possible pair of different indices","It always visits the tallest line first","It makes every candidate width equal","It sorts the heights implicitly"],"correct":0,"explanation":"Any legal container corresponds to one pair of indices. Since every pair is evaluated, the algorithm cannot miss the maximum.","hint":"Correctness follows from exhaustive coverage of the candidate set."},{"id":"w9","problem":"water","mode":"optimal","category":"Optimal solution","prompt":"In the two-pointer approach, which pointer should move after evaluating the current area?","detail":"Assume the left wall is shorter than the right wall.","options":["Move the right pointer inward","Move both pointers inward","Move the left pointer inward","Keep both pointers fixed"],"correct":2,"explanation":"The shorter wall is the limiting height. Keeping it while reducing width cannot improve area, so move the shorter side to search for a taller limiting wall.","hint":"Ask which side currently caps the water level."},{"id":"w10","problem":"water","mode":"optimal","category":"Optimal solution","prompt":"Why is moving the taller wall inward not useful as the greedy step?","detail":"The width always decreases when either pointer moves inward.","options":["The new width becomes larger","The shorter wall still limits the height while width decreases","The taller wall becomes zero","The array becomes unsorted"],"correct":1,"explanation":"If the shorter wall stays fixed, the maximum possible height is still limited by it, while the width gets smaller. That move cannot improve the current area.","hint":"Keep one boundary fixed and reason about the best possible height."},{"id":"w11","problem":"water","mode":"optimal","category":"Optimal solution","prompt":"What is the time complexity of the two-pointer solution?","detail":"Each pointer moves inward and never moves backward.","options":["O(n²)","O(n log n)","O(n)","O(1)"],"correct":2,"explanation":"Across the whole run, the pointers make at most n - 1 inward moves. Every move takes constant work, so time is O(n).","hint":"Count total pointer movements over the entire run."},{"id":"w12","problem":"water","mode":"optimal","category":"Optimal solution","prompt":"Which invariant best describes the two-pointer scan?","detail":"Think about what the algorithm has already ruled out as the pointers move.","options":["Every pair inside the current window is guaranteed to be optimal","At each step, a limiting shorter boundary is discarded because its remaining partners cannot improve on the current width","The pointers always point to equal heights","The current area is always increasing"],"correct":1,"explanation":"The greedy proof discards the shorter boundary: any pair using it with a closer partner has no greater limiting height and less width.","hint":"A useful invariant explains why discarded candidates no longer need to be checked."},{"id":"w13","problem":"water","mode":"complexity","category":"Complexity check","prompt":"Compare the two valid approaches. Which statement is accurate?","detail":"Consider both runtime and auxiliary memory.","options":["Brute force O(n²)/O(1); optimal O(n)/O(1)","Brute force O(n)/O(n); optimal O(n²)/O(1)","Both are O(n²) time","Optimal uses O(n) extra memory to store all pairs"],"correct":0,"explanation":"The nested loops examine all pairs in quadratic time. Two pointers reduce the scan to linear time; both use constant auxiliary space.","hint":"The two-pointer method does not allocate another array."},{"id":"w14","problem":"water","mode":"complexity","category":"Complexity check","prompt":"If n doubles, which growth pattern best describes the brute-force pair count?","detail":"Compare the approximate number of pairs before and after doubling n.","options":["It stays about the same","It roughly doubles","It roughly quadruples","It increases by one"],"correct":2,"explanation":"Quadratic growth scales by 2² when the input size doubles, so the pair count grows by roughly four times.","hint":"Think about n multiplied by n."},{"id":"p1","problem":"palindrome","mode":"understand","category":"Understand the prompt","prompt":"For Valid Palindrome, which characters participate in the comparison?","detail":"The prompt defines a normalized view of the string.","options":["Every character, including spaces and punctuation","Letters and digits only","Letters only; digits are ignored","Only lowercase letters"],"correct":1,"explanation":"The comparison ignores non-alphanumeric characters and treats uppercase and lowercase versions of a letter as equal.","hint":"The phrase “alphanumeric” includes two character families."},{"id":"p2","problem":"palindrome","mode":"understand","category":"Understand the prompt","prompt":"What should the algorithm return for a string that becomes empty after filtering?","detail":"No character pair can contradict the palindrome condition.","options":["false","Throw an exception","true","Return the original string"],"correct":2,"explanation":"An empty filtered string is a palindrome under this problem’s definition: there is no mismatching pair.","hint":"A palindrome check fails only when a compared pair differs."},{"id":"p3","problem":"palindrome","mode":"understand","category":"Understand the prompt","prompt":"Which pair of characters should compare as equal under the problem rules?","detail":"Assume both characters are letters.","options":["A and a","A and 1","! and ?","b and c"],"correct":0,"explanation":"Case is ignored, so uppercase A and lowercase a represent the same letter for the comparison.","hint":"Normalize letter casing before comparing."},{"id":"p4","problem":"palindrome","mode":"approach","category":"How to begin","prompt":"What should you clarify before implementing Valid Palindrome?","detail":"The exact comparison rules affect every later step.","options":["Whether punctuation and spaces are ignored and whether case matters","Whether the string is already sorted","Whether the input is always numeric","Whether the answer should contain the reversed string"],"correct":0,"explanation":"Confirm the definition of a valid character and the casing rule. Then test a short mixed-case example with punctuation.","hint":"Turn the natural-language rules into a precise character filter."},{"id":"p5","problem":"palindrome","mode":"approach","category":"How to begin","prompt":"What is a simple correct baseline solution?","detail":"Prefer a straightforward method you can prove before optimizing space.","options":["Normalize the string, reverse it, and compare","Sort the characters and compare","Count only vowels","Use binary search on the string"],"correct":0,"explanation":"Filtering to lowercase letters and digits, reversing, and comparing directly matches the palindrome definition.","hint":"A palindrome is unchanged by reversing its normalized form."},{"id":"p6","problem":"palindrome","mode":"approach","category":"How to begin","prompt":"What is the main optimization opportunity in the normalized-string solution?","detail":"The baseline stores a cleaned copy and a reversed representation.","options":["Avoid comparing characters","Compare from both ends without building another string","Sort the input in place","Use recursion to create more strings"],"correct":1,"explanation":"Two pointers can compare matching positions from the outside inward while skipping invalid characters, avoiding an O(n) cleaned copy.","hint":"Can you compare the outermost valid characters directly in the original string?"},{"id":"p7","problem":"palindrome","mode":"brute","category":"Brute-force reasoning","prompt":"What extra space does the normalize-and-reverse approach use?","detail":"The cleaned string can contain up to n characters.","options":["O(1)","O(log n)","O(n)","O(n²)"],"correct":2,"explanation":"The cleaned representation may hold a linear number of characters, so its auxiliary space is O(n).","hint":"Consider the worst case where every input character is kept."},{"id":"p8","problem":"palindrome","mode":"brute","category":"Brute-force reasoning","prompt":"Why is comparing the cleaned string with its reverse a valid baseline?","detail":"The cleaned string already reflects the problem’s character and case rules.","options":["It checks whether the normalized sequence reads identically in both directions","It guarantees the string contains unique characters","It checks whether the original string is sorted","It removes every repeated character"],"correct":0,"explanation":"After filtering and normalizing, a palindrome is exactly a sequence equal to its reversal.","hint":"Apply the palindrome definition after the required normalization."},{"id":"p9","problem":"palindrome","mode":"optimal","category":"Optimal solution","prompt":"What do the two pointers do when the left character is punctuation?","detail":"Only alphanumeric characters should be compared.","options":["Compare it with the right character","Move the left pointer forward until it reaches a letter or digit","Return false immediately","Swap it with the right character"],"correct":1,"explanation":"Non-alphanumeric characters are ignored, so advance the left pointer until it reaches a character that participates in the comparison.","hint":"Ignored characters should not consume a comparison."},{"id":"p10","problem":"palindrome","mode":"optimal","category":"Optimal solution","prompt":"When should the two-pointer palindrome algorithm return false?","detail":"The current pair contains two valid alphanumeric characters.","options":["Whenever the pointers move","When the normalized lowercase characters differ","When the characters have different original casing","When punctuation exists between the pointers"],"correct":1,"explanation":"A mismatch between the two valid characters proves that the normalized string is not a palindrome.","hint":"Case and punctuation have already been handled before this comparison."},{"id":"p11","problem":"palindrome","mode":"optimal","category":"Optimal solution","prompt":"What makes the two-pointer version O(1) auxiliary space?","detail":"The string is read in place; no filtered copy or reverse is created.","options":["It stores only two indices and a few character variables","It uses a second array of length n","It creates a reversed StringBuilder","It stores all valid characters in a set"],"correct":0,"explanation":"Only a constant number of variables are added, regardless of input length. The runtime is still O(n).","hint":"Separate the input storage from memory allocated by the algorithm."},{"id":"p12","problem":"palindrome","mode":"optimal","category":"Optimal solution","prompt":"What is the worst-case time complexity of the optimized scan?","detail":"Each pointer only advances through the string.","options":["O(1)","O(log n)","O(n)","O(n²)"],"correct":2,"explanation":"Each character is skipped or compared a constant number of times. The total work is linear.","hint":"Neither pointer ever moves backward."},{"id":"p13","problem":"palindrome","mode":"complexity","category":"Complexity check","prompt":"Which comparison of the two approaches is correct?","detail":"Both methods must inspect the input characters.","options":["Both O(n) time; baseline O(n) extra space, two pointers O(1)","Baseline O(n²), two pointers O(log n)","Baseline O(1) space, two pointers O(n) space","Both O(n²) time and O(n²) space"],"correct":0,"explanation":"Both approaches take linear time. The two-pointer approach avoids materializing a normalized string, reducing auxiliary space to O(1).","hint":"The optimization changes memory use, not the asymptotic time."},{"id":"p14","problem":"palindrome","mode":"complexity","category":"Complexity check","prompt":"If the input contains only punctuation and spaces, how much work is needed?","detail":"The algorithm still has to inspect the input to know every character is ignored.","options":["O(1) time because there are no letters","O(n) time to scan the characters","O(n²) time to compare every pair","O(log n) time using binary search"],"correct":1,"explanation":"Even if no character participates in the final comparison, the algorithm must scan the n input characters to establish that fact.","hint":"Ignoring a character still requires reading it."},{"id":"z1","problem":"zeros","mode":"understand","category":"Understand the prompt","prompt":"Which requirement is easy to overlook in Move Zeroes?","detail":"There are two correctness requirements, not just one.","options":["Non-zero values must keep their original relative order","The array must be sorted numerically","All negative values must be removed","The method must return a new array"],"correct":0,"explanation":"The operation must move zeroes to the end while preserving the order of all non-zero values.","hint":"Compare the order of the non-zero values before and after."},{"id":"z2","problem":"zeros","mode":"understand","category":"Understand the prompt","prompt":"What does “in place” mean for this problem?","detail":"Think about where the final arrangement must appear.","options":["Return an immutable copy","Modify the given array rather than using a new result as the final output","Sort a separate array and leave nums unchanged","Print the array to the console"],"correct":1,"explanation":"The required final arrangement must be written into the original input array.","hint":"The method signature returns void in the standard version."},{"id":"z3","problem":"zeros","mode":"understand","category":"Understand the prompt","prompt":"Which output satisfies the rules for input [0, 1, 0, 3, 12]?","detail":"Non-zero order must stay stable.","options":["[12, 3, 1, 0, f the original array.","hint":"Only the next destination index needs to be remembered."},{"id":"z7","problem":"zeros","mode":"brute","category":"Brute-force reasoning","prompt":"What are the complexities of copying through a temporary array and then copying back?","detail":"One pass reads the input, another copy writes n positions.","options":["O(n) time and O(n) extra space","O(n²) time and O(1) extra space","O(log n) time and O(n) extra space","O(1) time and O(1) extra space"],"correct":0,"explanation":"The scan and array copy each take linear time. The temporary array has n elements, so auxiliary space is O(n).","hint":"The temporary array grows with the input."},{"id":"z8","problem":"zeros","mode":"brute","category":"Brute-force reasoning","prompt":"Why does the temporary array preserve non-zero ordering?","detail":"Values are copied while traversing nums from the first index to the last.","options":["Values are sorted by size","Values are appended in the exact order encountered","A stack reverses them twice","The array is traversed from right to left"],"correct":1,"explanation":"The scan visits non-zero values from left to right and writes them sequentially, so their relative order is unchanged.","hint":"No sorting or reordering operation occurs during the copy."},{"id":"z9","problem":"zeros","mode":"optimal","category":"Optimal solution","prompt":"In the in-place solution, what does the write pointer represent?","detail":"It advances only when a non-zero value is placed.","options":["The index of the next zero to remove","The next position that should receive a non-zero value","The last non-zero value in sorted order","The number of zeroes remaining"],"correct":1,"explanation":"The write pointer tracks the boundary of the compacted non-zero prefix. Every accepted non-zero is written at that position.","hint":"Think of the prefix before write as the area already filled with non-zero values."},{"id":"z10","problem":"zeros","mode":"optimal","category":"Optimal solution","prompt":"After moving all non-zero values forward, what must happen to the remaining suffix?","detail":"The array must still have its original length.","options":["Fill every remaining position with zero","Leave the old values untouched","Sort the suffix","Delete the suffix from the array"],"correct":0,"explanation":"The remaining positions must be overwritten with zero so no stale values remain after the compacted prefix.","hint":"The array length does not change."},{"id":"z11","problem":"zeros","mode":"optimal","category":"Optimal solution","prompt":"Why does the read/write pointer solution preserve the order of non-zero values?","detail":"The read pointer scans in increasing index order.","options":["Each non-zero is written in the same order in which it is discovered","The algorithm sorts the prefix after each write","The write pointer moves backward","All values are swapped with the last element"],"correct":0,"explanation":"The scan encounters non-zero values in their original order and writes them sequentially from left to right.","hint":"Follow the sequence of values as read moves forward."},{"id":"z12","problem":"zeros","mode":"optimal","category":"Optimal solution","prompt":"What is the auxiliary-space complexity of the in-place write-pointer solution?","detail":"The original array is reused.","options":["O(n)","O(log n)","O(1)","O(n²)"],"correct":2,"explanation":"Only the read and write indices and a few scalar values are stored. No second array is allocated.","hint":"The number of variables does not grow with n."},{"id":"z13","problem":"zeros","mode":"complexity","category":"Complexity check","prompt":"Which statement correctly compares the baseline and optimized versions?","detail":"Both scan the input linearly.","options":["Both O(n) time; temporary array O(n) space; in-place O(1) space","Baseline O(n²), optimal O(n) time","Baseline O(1) space, optimal O(n) space","Both O(n²) time and O(n) space"],"correct":0,"explanation":"Both methods do linear work. The optimized version reuses nums and therefore reduces auxiliary space from O(n) to O(1).","hint":"The main improvement is space complexity."},{"id":"z14","problem":"zeros","mode":"complexity","category":"Complexity check","prompt":"Why is the in-place algorithm still O(n) time even though it has two loops?","detail":"One loop compacts; the second fills the remaining suffix.","options":["Because only one of the loops runs","Because the two loops process disjoint parts whose total length is at most n","Because two loops always mean O(n²)","Because filling zeroes takes O(1) time per array element but is ignored"],"correct":1,"explanation":"The first loop scans n elements. The fill loop touches only the suffix, which is at most n elements. Their combined work is bounded by a constant multiple of n.","hint":"Add the work, do not multiply the loop lengths."}]};
const app = document.getElementById('app');
const modalRoot = document.getElementById('modal-root');
const STORE = 'daily-algo-cards-v1';
let saved = loadSaved();
let screen = 'home';
let activeId = null;
let quiz = null;
let flash = null;
function loadSaved(){try{return JSON.parse(localStorage.getItem(STORE))||{custom:[],cardStats:{}}}catch{return{custom:[],cardStats:{}}}}
function persist(){localStorage.setItem(STORE,JSON.stringify(saved))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function allProblems(){return [...Object.values(SEED.problems),...saved.custom]}
function getProblem(id){return allProblems().find(p=>p.id===id)}
function isCustom(id){return saved.custom.some(p=>p.id===id)}
function countQuiz(id){return SEED.questions.filter(q=>q.problem===id).length}
function cardsFor(p){
  if(isCustom(p.id)) return p.cards||[];
  const b=p.brute||{},o=p.optimal||{};
  return [
    {id:p.id+'-what',front:'What is this problem asking?',back:p.description+'\n\nInput: '+p.input+'\n\nOutput: '+p.output},
    {id:p.id+'-start',front:'How should you begin?',back:p.approach+'\n\nClarify: '+(p.firstQuestions||[]).join(' · ')},
    {id:p.id+'-brute',front:'Explain the brute-force solution.',back:(b.idea||'')+'\n\nTime: '+(b.time||'—')+'   Space: '+(b.space||'—')+'\n\nJava solution:\n'+(b.code||'')},
    {id:p.id+'-optimal',front:'Explain the optimal solution.',back:(o.idea||'')+'\n\nTime: '+(o.time||'—')+'   Space: '+(o.space||'—')+'\n\nJava solution:\n'+(o.code||'')},
    {id:p.id+'-compare',front:'What makes the optimal solution better?',back:'Brute force: '+(b.time||'—')+' time, '+(b.space||'—')+' space.\nOptimal: '+(o.time||'—')+' time, '+(o.space||'—')+' space.\n\n'+p.approach},
    ...(saved.extraCards?.[p.id]||[])
  ];
}
function home(){
  const list=allProblems();
  app.innerHTML=`<section class="page-head"><div class="eyebrow">Your daily study set</div><h1>What are we learning today?</h1><p class="sub">Pick a problem, study the cards, or test yourself.</p></section>
  <div class="toolbar"><input class="search" id="search" placeholder="Search problems or patterns…" aria-label="Search problems"><button class="btn btn-primary" id="add-problem">+ Add problem</button></div>
  <div class="list" id="problem-list">${list.map(problemItem).join('')}</div>
  ${list.length===0?'<div class="empty">No problems yet. Add your first problem.</div>':''}`;
  document.getElementById('add-problem').onclick=showAddProblem;
  document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.problem').forEach(el=>el.classList.toggle('hidden',!el.dataset.search.includes(q)))};
  document.querySelectorAll('.problem').forEach(el=>el.onclick=()=>openProblem(el.dataset.id));
}
function problemItem(p){const cards=cardsFor(p).length,quizCount=countQuiz(p.id);return `<article class="problem" data-id="${esc(p.id)}" data-search="${esc((p.title+' '+(p.tags||[]).join(' ')).toLowerCase())}"><div class="problem-main"><div class="problem-title">${esc(p.title)}</div><div class="problem-desc">${esc(p.description||p.pattern||'')}</div><div class="tags"><span class="tag">${esc((p.tags||[p.pattern||'Custom']).slice(0,2).join(' · '))}</span><span class="tag">${cards} ${cards===1?'card':'cards'}</span>${quizCount?`<span class="tag">${quizCount} quiz questions</span>`:''}${isCustom(p.id)?'<span class="tag">Your problem</span>':''}</div></div><span class="chevron">›</span></article>`}
function openProblem(id){activeId=id;screen='detail';detail()}
function detail(){const p=getProblem(activeId);if(!p){home();return}const cards=cardsFor(p),q=countQuiz(p.id);app.innerHTML=`<button class="back" id="back">← All problems</button><div class="detail-top"><div><div class="eyebrow">${esc((p.tags||[p.pattern||'Your problem']).join(' · '))}</div><h1>${esc(p.title)}</h1><p class="sub">${esc(p.description||'Your personal study set.')}</p></div></div><div class="detail-actions"><button class="btn btn-primary" id="study">Study flashcards (${cards.length})</button>${q?`<button class="btn btn-light" id="take-quiz">Quick quiz (${q})</button>`:''}<button class="btn btn-light" id="add-card">+ Add card</button>${isCustom(p.id)?'<button class="btn btn-text" id="delete-problem">Delete</button>':''}</div><div class="section-label">YOUR FLASHCARDS</div><div class="card-list">${cards.map((c,i)=>`<div class="mini-card"><span>${i+1}. ${esc(c.front)}</span><span class="muted">›</span></div>`).join('')}</div>${!isCustom(p.id)?'<div class="custom-note">Java code is included on the brute-force and optimal flashcards. Add your own questions anytime.</div>':''}`;
 document.getElementById('back').onclick=home;document.getElementById('study').onclick=()=>startFlashcards(p.id);const qb=document.getElementById('take-quiz');if(qb)qb.onclick=()=>startQuiz(p.id);document.getElementById('add-card').onclick=()=>showAddCard(p.id);const del=document.getElementById('delete-problem');if(del)del.onclick=()=>{if(confirm('Delete this problem and its cards?')){saved.custom=saved.custom.filter(x=>x.id!==p.id);persist();home()}};
}
function showAddProblem(){modal(`<div class="modal-head"><h2>Add a problem</h2><button class="close" data-close>×</button></div><form id="problem-form"><div class="field"><label for="p-title">Problem name</label><input id="p-title" required maxlength="90" placeholder="e.g. Two Sum"></div><div class="field"><label for="p-pattern">Pattern</label><input id="p-pattern" required maxlength="60" placeholder="e.g. Hash Map"></div><div class="field"><label for="p-description">What is the problem asking?</label><textarea id="p-description" placeholder="Write a short description (optional)"></textarea></div><div class="field"><label for="p-question">First flashcard question</label><input id="p-question" required placeholder="e.g. How would I start?"></div><div class="field"><label for="p-answer">Answer / explanation</label><textarea id="p-answer" required placeholder="Write the answer, approach, or Java notes…"></textarea></div><p class="hint">You can add more flashcards after saving.</p><div class="modal-actions"><button type="button" class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" type="submit">Save problem</button></div></form>`);
 document.getElementById('problem-form').onsubmit=e=>{e.preventDefault();const id='custom-'+Date.now();const p={id,title:document.getElementById('p-title').value.trim(),pattern:document.getElementById('p-pattern').value.trim(),tags:[document.getElementById('p-pattern').value.trim()],description:document.getElementById('p-description').value.trim(),cards:[{id:id+'-card-1',front:document.getElementById('p-question').value.trim(),back:document.getElementById('p-answer').value.trim()}]};if(!p.title||!p.pattern||!p.cards[0].front||!p.cards[0].back)return;saved.custom.unshift(p);persist();closeModal();activeId=id;detail()};}
function showAddCard(id){modal(`<div class="modal-head"><h2>Add a flashcard</h2><button class="close" data-close>×</button></div><form id="card-form"><div class="field"><label for="c-front">Question</label><textarea id="c-front" required placeholder="e.g. What is the brute-force approach?"></textarea></div><div class="field"><label for="c-back">Answer</label><textarea id="c-back" required placeholder="Your explanation or Java code notes…"></textarea></div><div class="modal-actions"><button type="button" class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" type="submit">Add card</button></div></form>`);document.getElementById('card-form').onsubmit=e=>{e.preventDefault();const p=getProblem(id);if(!p)return;if(!isCustom(id)){saved.extraCards=saved.extraCards||{};saved.extraCards[id]=saved.extraCards[id]||[];saved.extraCards[id].push({id:id+'-c-'+Date.now(),front:document.getElementById('c-front').value.trim(),back:document.getElementById('c-back').value.trim()})}else{p.cards.push({id:id+'-c-'+Date.now(),front:document.getElementById('c-front').value.trim(),back:document.getElementById('c-back').value.trim()})}persist();closeModal();detail()};}
function modal(html){modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true">${html}</section></div>`;modalRoot.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);modalRoot.querySelector('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()};}
function closeModal(){modalRoot.innerHTML=''}
function startFlashcards(id){const p=getProblem(id);flash={id,cards:cardsFor(p),index:0,revealed:false};screen='flash';renderFlash()}
function renderFlash(){const p=getProblem(flash.id);const card=flash.cards[flash.index];app.innerHTML=`<div class="flash-shell"><button class="back" id="exit-flash">← ${esc(p.title)}</button><div class="flash-top"><span>FLASHCARDS</span><span>${flash.index+1} / ${flash.cards.length}</span></div><div class="progress"><div style="width:${((flash.index+1)/flash.cards.length)*100}%"></div></div><article class="flashcard" id="flip"><div class="flash-type">${flash.revealed?'ANSWER':'QUESTION'}</div>${flash.revealed?`<div class="flash-answer">${renderAnswer(card.back)}</div>`:`<div class="flash-text">${esc(card.front)}</div><div class="flash-instruction">Tap to reveal answer</div>`}</article><div class="flash-actions">${flash.revealed?`<button class="btn btn-light" id="again">Review again</button><button class="btn btn-primary" id="got-it">Got it</button>`:`<button class="btn btn-primary" id="show-answer">Show answer</button>`}</div></div>`;document.getElementById('exit-flash').onclick=()=>openProblem(flash.id);document.getElementById('flip').onclick=()=>{flash.revealed=!flash.revealed;renderFlash()};const show=document.getElementById('show-answer');if(show)show.onclick=()=>{flash.revealed=true;renderFlash()};const next=()=>{flash.index++;flash.revealed=false;if(flash.index>=flash.cards.length){app.innerHTML=`<div class="done"><div class="eyebrow">Study session complete</div><h1>Nice work.</h1><p class="sub">You went through ${flash.cards.length} cards.</p><div style="margin-top:24px"><button class="btn btn-primary" id="done">Back to problem</button></div></div>`;document.getElementById('done').onclick=()=>openProblem(flash.id)}else renderFlash()};const a=document.getElementById('again');if(a)a.onclick=next;const g=document.getElementById('got-it');if(g)g.onclick=next;}
function renderAnswer(text){const safe=esc(text);const parts=safe.split('Java solution:\n');if(parts.length===1)return safe;return parts[0]+'Java solution:<pre>'+parts.slice(1).join('Java solution:\n')+'</pre>'}
function startQuiz(id){const qs=SEED.questions.filter(q=>q.problem===id);if(!qs.length)return;const shuffled=[...qs].sort(()=>Math.random()-.5);quiz={id,questions:shuffled,index:0,selected:null,score:0,answered:false};screen='quiz';renderQuiz()}
function renderQuiz(){const p=getProblem(quiz.id);if(quiz.index>=quiz.questions.length){renderQuizDone();return}const q=quiz.questions[quiz.index];const chosen=quiz.selected;const html=q.options.map((op,i)=>{let cls='';if(quiz.answered&&i===q.correct)cls='correct';else if(quiz.answered&&i===chosen)cls='wrong';return `<button class="answer ${cls}" data-choice="${i}" ${quiz.answered?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(op)}</span></button>`}).join('');app.innerHTML=`<div class="quiz-wrap"><div class="quiz-top"><button class="back" id="exit-quiz">← ${esc(p.title)}</button><span class="muted" style="font-size:12px;font-weight:700">${quiz.score} correct</span></div><div class="progress"><div style="width:${(quiz.index/quiz.questions.length)*100}%"></div></div><article class="question-card"><div class="q-meta"><span>${esc(q.category||'QUIZ')}</span><span>${quiz.index+1} / ${quiz.questions.length}</span></div><div class="question">${esc(q.prompt)}</div>${q.detail?`<p class="q-detail">${esc(q.detail)}</p>`:''}<div class="answers">${html}</div><div class="feedback ${quiz.answered?'show':''}">${quiz.answered?`<strong>${quiz.selected===q.correct?'That’s right!':'Not quite — keep going.'}</strong>${esc(q.explanation)}`:''}</div><div class="quiz-bottom"><span class="muted" style="font-size:11px">${quiz.answered?'Answer saved':'Choose one answer'}</span><button class="btn btn-primary" id="next" ${quiz.answered?'':'disabled style="opacity:.4;cursor:not-allowed"'}>${quiz.index===quiz.questions.length-1?'Finish':'Next question'} →</button></div></article></div>`;document.getElementById('exit-quiz').onclick=()=>openProblem(quiz.id);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(quiz.answered)return;quiz.selected=Number(b.dataset.choice);quiz.answered=true;if(quiz.selected===q.correct)quiz.score++;renderQuiz()});const next=document.getElementById('next');next.onclick=()=>{if(!quiz.answered)return;quiz.index++;quiz.selected=null;quiz.answered=false;renderQuiz()}}
function renderQuizDone(){app.innerHTML=`<div class="done"><div class="eyebrow">QUIZ FINISHED</div><h1>Good practice.</h1><div class="done-score">${quiz.score}/${quiz.questions.length}</div><p class="sub">You got ${Math.round(quiz.score/quiz.questions.length*100)}% correct.</p><div style="display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:22px"><button class="btn btn-primary" id="retry">Try again</button><button class="btn btn-light" id="return">Back to problem</button></div></div>`;document.getElementById('retry').onclick=()=>startQuiz(quiz.id);document.getElementById('return').onclick=()=>openProblem(quiz.id)}
home();
</script>
</body>
</html>
